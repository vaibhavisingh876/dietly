<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Leaf Blade Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8E063" />
      <stop offset="50%" stop-color="#56AB2F" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>

    <!-- Highlight Soft Gradient -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#A8E063" stop-opacity="0" />
    </linearGradient>

    <!-- Stem Gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7CB342" />
      <stop offset="100%" stop-color="#33691E" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Eye Shine Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#1B5E20" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    /* Continuous Keyframe Animations */
    @keyframes sway {
      0%, 100% {
        transform: rotate(-3deg) translateY(0px);
      }
      50% {
        transform: rotate(4deg) translateY(-8px);
      }
    }

    @keyframes floatParticle {
      0% {
        transform: translate(0, 0) scale(0.8);
        opacity: 0;
      }
      50% {
        opacity: 0.8;
      }
      100% {
        transform: translate(20px, -45px) scale(1.2);
        opacity: 0;
      }
    }

    @keyframes pulseGlow {
      0%, 100% {
        opacity: 0.4;
        transform: scale(0.98);
      }
      50% {
        opacity: 0.8;
        transform: scale(1.03);
      }
    }

    @keyframes eyeBlink {
      0%, 48%, 52%, 100% {
        transform: scaleY(1);
      }
      50% {
        transform: scaleY(0.1);
      }
    }

    /* Applied Animation Classes */
    .animated-leaf {
      transform-origin: 250px 420px;
      animation: sway 4s ease-in-out infinite;
    }

    .eye {
      transform-origin: center;
      animation: eyeBlink 4s infinite;
    }

    .particle-1 { animation: floatParticle 3s ease-out infinite; }
    .particle-2 { animation: floatParticle 2.5s ease-out 0.8s infinite; }
    .particle-3 { animation: floatParticle 3.2s ease-out 1.5s infinite; }

    .magic-glow {
      transform-origin: center;
      animation: pulseGlow 3s ease-in-out infinite;
    }
  </style>

  <!-- Ambient Magic Aura -->
  <circle class="magic-glow" cx="250" cy="230" r="170" fill="#81C784" opacity="0.3" filter="url(#glow)" />

  <!-- Main Animated Character Container -->
  <g class="animated-leaf" filter="url(#shadow)">
    
    <!-- Stem -->
    <path d="M 235 320 C 220 370 200 420 160 440 C 155 442 160 450 168 448 C 215 425 240 370 252 320 Z" 
          fill="url(#stemGrad)" />

    <!-- Back/Shadow Leaf Layer (Depth) -->
    <path d="M 250 60 C 370 120 430 250 350 340 C 270 430 200 350 250 60 Z" 
          fill="#2E7D32" opacity="0.3" transform="rotate(-5 250 240)" />

    <!-- Main Leaf Body -->
    <path d="M 250 50 
             C 380 110 430 260 320 350 
             C 210 440 100 330 140 230 
             C 170 155 210 80 250 50 Z" 
          fill="url(#leafGrad)" />

    <!-- Top Highlight Curve -->
    <path d="M 250 55 
             C 330 105 380 200 330 280 
             C 300 220 260 110 250 55 Z" 
          fill="url(#highlightGrad)" />

    <!-- Soft Vein Network -->
    <g stroke="#AED581" stroke-width="3.5" stroke-linecap="round" opacity="0.4" fill="none">
      <!-- Central Main Vein -->
      <path d="M 250 50 C 240 150 245 250 245 340" stroke="#7CB342" stroke-width="5" />
      
      <!-- Side Veins -->
      <path d="M 247 130 Q 200 110 175 115" />
      <path d="M 247 170 Q 190 150 155 165" />
      <path d="M 246 210 Q 180 200 148 222" />
      <path d="M 245 250 Q 190 250 165 280" />

      <path d="M 248 140 Q 295 120 325 130" />
      <path d="M 247 180 Q 305 165 338 185" />
      <path d="M 246 220 Q 305 215 328 245" />
      <path d="M 245 260 Q 295 265 310 295" />
    </g>

    <!-- Kawaii Cute Face Group -->
    <g transform="translate(0, 10)">
      
      <!-- Left Eye -->
      <g class="eye" transform="translate(205, 210)">
        <circle cx="0" cy="0" r="15" fill="#1B5E20" />
        <circle cx="-4" cy="-4" r="5" fill="#FFFFFF" />
        <circle cx="4" cy="5" r="2" fill="#FFFFFF" />
      </g>

      <!-- Right Eye -->
      <g class="eye" transform="translate(275, 205)">
        <circle cx="0" cy="0" r="15" fill="#1B5E20" />
        <circle cx="-4" cy="-4" r="5" fill="#FFFFFF" />
        <circle cx="4" cy="5" r="2" fill="#FFFFFF" />
      </g>

      <!-- Blushing Cheeks -->
      <ellipse cx="188" cy="223" rx="10" ry="6" fill="#FF8A80" opacity="0.6" />
      <ellipse cx="292" cy="218" rx="10" ry="6" fill="#FF8A80" opacity="0.6" />

      <!-- Happy Open Smile -->
      <path d="M 230 218 Q 240 235 250 216" 
            fill="#1B5E20" stroke="#1B5E20" stroke-width="3" stroke-linecap="round" />
      <!-- Tongue -->
      <path d="M 235 224 Q 240 233 245 223 Z" fill="#FF5252" />
    </g>

    <!-- Decorative Foreground Dew Drop -->
    <g transform="translate(300, 260)">
      <drop-shadow>
        <path d="M 0 -10 C 8 -2 10 5 0 12 C -10 5 -8 -2 0 -10 Z" fill="#E0F7FA" opacity="0.9" />
        <circle cx="-2" cy="2" r="3" fill="#FFFFFF" opacity="0.8" />
      </drop-shadow>
    </g>

  </g>

  <!-- Floating Magic Particles / Spores -->
  <g fill="#C8E6C9">
    <circle class="particle-1" cx="340" cy="180" r="4" />
    <circle class="particle-2" cx="150" cy="240" r="3" />
    <circle class="particle-3" cx="310" cy="320" r="5" />
  </g>
</svg>
